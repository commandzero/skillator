notes: |
  # Semantic review: library-rsync
  
  Reviewed the archived delta and combined main specifications at implementation commit 5f816e4. All 22 affected requirements and 38 scenarios remain present. Twenty-one requirement blocks match their archived delta exactly. The statement of “Skillator composes with Git repository operations” now also names the separately merged, bounded `library update` command; its two rsync scenarios retain their original text. No scenario was dropped from a modified requirement. The new library-rsync main spec retains the delta Purpose. There are no removals or renames.
  
  CLI contract: the Git-clone exception is limited to first-time library synchronization at the initiating commit. The merged `library update` command is separately limited to fast-forwarding clean registered checkouts; rsync still never updates existing checkouts. The general Git/worktree ownership rule, shared report envelope, stable host aliases, explicit policies, and exit-status rules remain coherent with both implemented commands.
  
  Library management: ordinary missing inventory remains unresolved rather than authorizing deletion. Acquisition modes still govern explicit local acquisition; remote synchronization preserves registered home-relative locations and existing local configuration.
  
  Library rsync: the new capability covers host preflight, path and skill boundaries, exact Git revision, multi-host and conflict planning, missing-file policy, verified history, recovery, and read-only preview. Its scenarios align with the implementation and the acceptance and regression evidence in validation.md and verification.md.
  
  User scope: first-run local configuration remains distinct from explicit remote selection reconciliation. Independent selections merge semantically; receiving links are rebuilt locally and unmanaged entries remain protected.
  
  Reviewed scenarios by requirement:
  
  ## cli-contract
  
  - Skillator composes with Git repository operations: Acquire a remote Skill source; Create a linked worktree.
  - Machine output is deterministic and ANSI-free: YAML string-like scalar.
  - JSON and YAML encode one compact report: Equivalent machine formats; Advisory discovery.
  - Library rsync exposes explicit policies: Default command.
  - Remote synchronization reports partial and blocked work: Source mismatch after host preflight.
  
  ## library-management
  
  - Missing inventory leaves declarations unresolved: Source missing on another machine; Skill moved.
  - The local Library accepts explicit acquisition modes: External Skill moved into the local Library; External Skill copied or linked.
  - Remote library registration preserves local configuration: Register external incoming location.
  
  ## library-rsync
  
  - Hosts are configured explicitly: Explicit host subset.
  - Every selected host passes preflight before writes: Skillator is missing remotely; Incompatible remote version; Receiving host has no library configuration.
  - Library paths preserve their home-relative location: Different user homes; Destination parent escapes home.
  - All skill content participates: Hidden skill with supporting files.
  - New Git sources use the initiating host's exact commit: Upstream has advanced; Existing remote checkout differs; Private or unpublished commit cannot be cloned.
  - Git content and local edits remain separate: Local tracked skill edit on initial sync; Different edits to the same tracked file.
  - Multi-host planning does not depend on host order: Remote edit reaches another host.
  - Conflicts require an explicit policy: Multiple remote candidates; Noninteractive ask.
  - Missing skill content follows an explicit policy: Default restores an unchanged deleted file; Explicit deletion propagation; Delete versus edit.
  - Synchronization history records only verified results: Interrupted transfer.
  - Preview and application preserve recoverable state: Preview needs a clone; Destination changes after planning.
  
  ## user-scope-onboarding
  
  - User Scope Configuration is strict and machine-local: First User Scope configuration.
  - Remote synchronization reconciles user selections semantically: Remote deselection; First-contact independent selections.
  - Received selections use local reconciliation: Rebuild a user link; Unmanaged user entry.
  
  The archived design now records protocol 4 because snapshots carry invalid-skill paths separately from transferable files and peers validate their physical stage identity before transfers. The latest verification evidence covers blocked dependent selections after registration failure and independent treatment of internal symbolic links. These fixes preserve the existing main-spec requirements and scenarios. Post-Begin Git reference revalidation now precedes any absent-checkout clone, and returned staging paths are checked against the observed home before transfer. The changed-commit and outside-stage regressions cover both ordering and path containment. Root-level invalid skills and absent sources or skills do not propagate new Enablements, while existing selections remain local. A former receiver uses acknowledged peer identities to detect replacement of a previously synchronized host even when its SSH aliases differ. Transfer and publication validate that the stage remains the directory created at Begin; alias publication rechecks its physical destination and target. Library writes and updates now share the rsync user-home lock. Parent skill collection and authorization exclude nested Git checkout boundaries, leaving their files under the nested source’s own Git reference. New Enablements now wait until each receiving host has an acknowledged skill manifest; read-only preview also recognizes a planned manifest copy, while `--missing ignore` preserves absence and reports the selection as unavailable. Coupled directory removal includes the directory key explicitly and records its absence in peer baselines. Git clone and follow-up Git commands now bind to an open staging directory descriptor, avoiding path redirection through a replaced ancestor.
  
  Publication now holds the physical destination parent open and performs sibling creation, copy, rename, verification, and cleanup relative to that directory handle. An ancestor symlink swap cannot redirect those writes outside home. The archived design and verification record describe the boundary and regression.
  
  Session and clone stages, alias staging, export and recovery-journal writes, and recovery cleanup now use opened directory handles for path-race containment. The archived design and verification record cover the additional regression.
  
  Divergent usable peer acknowledgements now block affected file and selection paths. Source files are opened without following final symlinks through held parent handles, and synchronization history uses descriptor-relative conditional publication. First-contact independent selections continue to merge key-by-key; the archived verification records the reviewed evidence.
  
  An existing session lock is now opened without following its final symlink, and history publication verifies the live state after create or exchange before reporting success. A deterministic intervening-edit regression preserves both the newer live entry and the old history for recovery.
  
  A known peer baseline is no longer inferred for a cohort containing a first-contact peer with unknown history; independent content conflicts under the default policy. Library and User Scope configurations are parsed from non-following, contained reads before snapshot serialization, and incoming Library registration uses descriptor-relative conditional publication.
  
  Registration preparation no longer creates directories by pathname before the descriptor-relative conditional save. Peer response handling accepts only defined error statuses 2 through 4; malformed statuses become local protocol errors.
  
  Host configuration and synchronization history now use contained, non-following reads, and the initiating stage is revalidated immediately before and after every remote push. The archived design and verification record cover these boundaries.
  
  The latest transport fix binds local and remote rsync processes to opened stage directory inodes after checking the Begin identity. It passes only relative entry names to rsync, while an encoded stage path preserves shell paths with spaces. The local process adapter uses held directory handles. A swapped-stage regression and a real-rsync shell-transport CLI regression cover the changed boundary in both directions. The archived design and verification evidence describe it.
  
  The subsequent fix preserves hidden-skill settings when locations change. Remote user reconciliation checks a contained Library Configuration read against the observed hash, advances that hash only after successful registration, and restricts Library scanning to locations inside the user home. Linux rsync now uses the explicit legacy argument mode to avoid escaping its already quoted remote pathname twice; a disposable Linux reproduction and the cross-shell CLI regression cover the difference. The archived design and verification evidence record both changes.
  
  The latest follow-up rejects configured library locations whose existing ancestor symlink escapes home even when the final child is absent. The publication interval is covered by deterministic create, replace, and remove tests: atomic no-replace or exchange/move preserves the intervening destination in place or in a recoverable sibling, and verification reports a mismatch before cleanup. The Linux CI Clippy fix copies permissions from the held source file rather than converting a platform-specific mode integer. These changes preserve the same specification guarantees and are recorded in the archived evidence.
  
  The final lock-lifetime fix retains a session-owned user-home lock through User Scope reconciliation, acknowledgement, history publication, and Finish. Reconciliation shares the underlying file lock while it prepares and executes materializations. A regression proves competing user-home writers stay blocked after User and Acknowledge and are released only at Finish. The archived design and verification evidence record the boundary.
  
  Finding: the merged main specs faithfully express the completed rsync change alongside the separately merged library update feature. The one combined statement is a deliberate, compatible extension; no rsync scenario or guarantee was lost.

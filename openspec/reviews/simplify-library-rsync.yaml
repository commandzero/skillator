  # Refreshed OpenSpec semantic review: simplify-library-rsync
  
  Reviewer: openai-codex/gpt-6.1-sol
  Reviewed implementation/spec/archive head: `a78ff15346e87f45a5beb7ee4c54799a0cf929a6`.
  
  ## Delta correspondence and later changes
  
  All eight library-rsync requirements and both selected library-management requirements retain their archived statements and scenarios. They preserve explicit leader/follower roles, complete discovered skill content, leader authority, isolated owned replicas, incomplete-input refusal, SSH/rsync delivery, write-free previews, retryable outcomes, unresolved missing inventory, and explicit acquisition modes. All six cli-contract requirements remain present; machine-report, determinism, Git-composition and rsync outcome/non-interactive scenarios are retained.
  
  The CLI default-root scenario intentionally follows the later archived fix-tui-scope-controls contract rather than restoring historical Library-first startup. Root selects Repo inside Git and User at physical home (including home-as-Git) or outside Git, even without Library configuration. Onboarding occurs only when Library is explicitly opened. The stale cli-contract scenario and library-management onboarding reference were corrected to this already-implemented contract. This is documentation maintenance, not repeated synchronization or mutation of an archived change. No capability or requirement was removed or renamed.
  
  The newer advisory-skill-naming Library inventory contract remains authoritative: safe naming deviations are warnings and do not block export, while unsafe metadata remains blocking. No old naming policy was restored. Follower inspection now reads self-contained relative SKILL.md link chains at their registered identity without replica writes, while rejecting unsafe chains and preserving output/document limits. Delivery still preserves complete supporting content and original links.
  
  ## Implementation and exercised evidence
  
  Full repository preflight passed: formatting, Clippy, 347 passing tests, OKF, all 12 main specs and release safeguards. Native macOS arm64 PTY smoke exercised actual root context/onboarding, scope-local deletion, fresh Target disk inventory, canceled/accepted Target changes and unchanged saved configuration. A disposable key-only SSH server plus real rsync delivered a relative-linked SKILL.md; the native read-only follower tab and inspector showed the linked document body and preserved the symlink. Filesystem-backed inspection regressions cover relative/physical-parent chains, trailing-newline targets, supporting directories named SKILL.md, escaping/absolute/broken/cyclic/overlong chains, hard links, unsupported documents and size limits. Strict main-spec validation and native archived-task validation passed (12 specs, 13 archives).
  
  All associated artifacts remain committed and task-complete. This receipt binds the preserved archive and current main-spec Git objects; it is not an independent human review or Linux/WSL execution claim.

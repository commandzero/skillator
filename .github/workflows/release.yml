name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          set -eu
          rustflags="--remap-path-prefix=${GITHUB_WORKSPACE}=."
          rustflags="${rustflags} --remap-path-prefix=${HOME}/.cargo=/cargo"
          rustflags="${rustflags} --remap-path-prefix=$(rustc --print sysroot)=/rustc"
          RUSTFLAGS="${rustflags}" cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package
        shell: bash
        env:
          ARTIFACT: skillator-${{ env.RELEASE_TAG }}-${{ matrix.target }}
        run: |
          set -eu
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/skillator" "dist/${ARTIFACT}"
          tar -C dist -czf "dist/${ARTIFACT}.tar.gz" "${ARTIFACT}"
          (
            cd dist
            shasum -a 256 "${ARTIFACT}.tar.gz"
          ) > "dist/${ARTIFACT}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Skillator ${RELEASE_TAG}" \
              --generate-notes
          fi
